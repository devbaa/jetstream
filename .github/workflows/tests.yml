name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.5]
        laravel: [13]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts=^${{ matrix.laravel }}" --dev --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/phpunit --display-deprecations --fail-on-deprecation

  # sqlite is permissive about types, so it agrees with schemas a stricter
  # engine rejects: a UUID sits happily in an integer-affinity column there.
  # Several defects survived on exactly that difference, so the suite runs
  # against a real PostgreSQL as well rather than only against the driver that
  # forgives the most.
  postgres-tests:
    runs-on: ubuntu-22.04

    name: PHP 8.4 - Laravel 13 - PostgreSQL 16

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jetstream_test
          POSTGRES_USER: jetstream
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Without this the suite would fall back to sqlite and report a green
      # PostgreSQL lane that never spoke to PostgreSQL.
      - name: Verify the lane is actually on PostgreSQL
        run: |
          php -r '
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=jetstream_test", "jetstream", "secret");
            echo $pdo->query("select version()")->fetchColumn(), PHP_EOL;
          '
        env:
          DB_CONNECTION: pgsql

      - name: Execute tests
        run: vendor/bin/phpunit --display-deprecations --fail-on-deprecation
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: jetstream_test
          DB_USERNAME: jetstream
          DB_PASSWORD: secret

  # The package suite above exercises behaviour; this exercises the installer
  # and the migrations it publishes, on a real generated application, against
  # the engine that enforces types. Most of the schema defects this fork has
  # had lived in that seam and were invisible on sqlite.
  stub-tests-postgres:
    runs-on: ubuntu-22.04

    name: Test Stubs - Laravel 13 - livewire - PostgreSQL 16

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jetstream
          POSTGRES_USER: jetstream
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: jetstream
      DB_USERNAME: jetstream
      DB_PASSWORD: secret

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Create a Laravel application
        run: composer create-project laravel/laravel:13.x-dev . --no-scripts

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'jetstream'
          persist-credentials: false

      - name: Point the application at PostgreSQL
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

          # The generated .env is written for sqlite; the job's DB_* variables
          # only reach artisan if the file does not override them.
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^#\s*DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^#\s*DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^#\s*DB_DATABASE=.*/DB_DATABASE=jetstream/' .env
          sed -i 's/^#\s*DB_USERNAME=.*/DB_USERNAME=jetstream/' .env
          sed -i 's/^#\s*DB_PASSWORD=.*/DB_PASSWORD=secret/' .env

          grep '^DB_' .env

          php artisan db:show --json | head -c 400

      - name: Require the checked out package
        run: |
          composer config repositories.jetstream '{"type": "path", "url": "jetstream", "options": {"symlink": false}}' --file composer.json
          composer require devbaa/jetstream:@dev --prefer-dist --no-interaction --no-progress -W

      - name: Install Jetstream
        run: php artisan jetstream:install livewire --api --verification

      - name: Migrate and seed the generated application
        run: php artisan migrate --seed --force

      # Every column below was a defect that sqlite accepted. Asserting the
      # types PostgreSQL actually gave them is the point of this lane.
      - name: The schema is the one this package expects
        run: |
          php artisan tinker --execute='
            $expected = [
              ["users", "id", "uuid"],
              ["users", "current_team_id", "uuid"],
              ["sessions", "user_id", "uuid"],
              ["audit_logs", "auditable_id", "character varying"],
              ["personal_access_tokens", "tokenable_id", "character varying"],
            ];

            $failed = false;

            foreach ($expected as [$table, $column, $type]) {
              $found = null;

              foreach (Illuminate\Support\Facades\Schema::getColumns($table) as $candidate) {
                if ($candidate["name"] === $column) { $found = $candidate["type"]; }
              }

              $ok = $found !== null && str_starts_with($found, $type);

              echo ($ok ? "ok   " : "FAIL ").$table.".".$column." => ".var_export($found, true).PHP_EOL;

              $failed = $failed || ! $ok;
            }

            if ($failed) { exit(1); }
          '

      # And prove the schema is usable, not merely shaped right.
      - name: A user can be created, audited and issued a token
        run: |
          php artisan tinker --execute='
            $user = App\Models\User::factory()->create();

            $token = $user->createToken("ci");

            if ((string) $token->accessToken->tokenable_id !== (string) $user->id) {
              fwrite(STDERR, "The token was not stored against its owner.".PHP_EOL);
              exit(1);
            }

            if ($user->auditLogs()->count() < 1) {
              fwrite(STDERR, "Creating the user wrote no audit entry.".PHP_EOL);
              exit(1);
            }

            echo "user ".$user->id." has a token and an audit trail".PHP_EOL;
          '

  stub-tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        test_style: [phpunit, pest]

    name: Test Stubs - Laravel 13 - livewire - ${{ matrix.test_style }}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Create a Laravel application
        run: composer create-project laravel/laravel:13.x-dev .

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'jetstream'
          persist-credentials: false

      - name: Require the checked out package
        run: |
          composer config repositories.jetstream '{"type": "path", "url": "jetstream", "options": {"symlink": false}}' --file composer.json
          composer require devbaa/jetstream:@dev --prefer-dist --no-interaction --no-progress -W

      - name: Verify the package under test
        run: |
          composer show devbaa/jetstream
          if composer show --name-only 2>/dev/null | grep -qx 'laravel/jetstream'; then
            echo 'Upstream laravel/jetstream must not be installed alongside devbaa/jetstream.'
            exit 1
          fi

      # "composer create-project" migrates the application it creates, so at
      # this point Laravel has recorded the users migration and built its own
      # version of the three tables that migration creates — the exact
      # condition that silently produced a broken schema. Pin the refusal here,
      # on the real generated application, before wiping for the clean install
      # below.
      - name: Refuse to install onto a pre-migrated application
        run: |
          php -r 'file_put_contents("/tmp/schema-before.json", json_encode(
            (new PDO("sqlite:database/database.sqlite"))
              ->query("select name, sql from sqlite_master order by name")
              ->fetchAll(PDO::FETCH_ASSOC)
          ));'

          # The state under test: the migration recorded, its tables in
          # Laravel's shape rather than Jetstream's.
          php -r '
            $ran = (new PDO("sqlite:database/database.sqlite"))
              ->query("select migration from migrations")->fetchAll(PDO::FETCH_COLUMN);

            if (! in_array("0001_01_01_000000_create_users_table", $ran, true)) {
              fwrite(STDERR, "The generated application was not migrated; there is nothing to refuse.\n");
              exit(1);
            }
          '

          set +e
          php artisan jetstream:install livewire --api --verification > /tmp/install.log 2>&1
          status=$?
          set -e

          cat /tmp/install.log

          if [ "$status" -eq 0 ]; then
            echo 'The installer accepted a database its migration cannot fix.'
            exit 1
          fi

          # Any crash also exits non-zero, so the refusal itself has to be the
          # reason: assert the message, not just the status.
          grep -q 'not one Jetstream can install onto' /tmp/install.log || {
            echo 'The installer failed for some reason other than the consistency check.'
            exit 1
          }

          php -r '
            $after = json_encode(
              (new PDO("sqlite:database/database.sqlite"))
                ->query("select name, sql from sqlite_master order by name")
                ->fetchAll(PDO::FETCH_ASSOC)
            );

            if ($after !== file_get_contents("/tmp/schema-before.json")) {
              fwrite(STDERR, "The refused install changed the database schema.\n");
              exit(1);
            }
          '

      # The other half of the contract: nothing recorded, but the tables the
      # migration creates are already there, so it would run and fail on the
      # first "Schema::create". Deleting the ledger rows and leaving the schema
      # alone is exactly that state.
      - name: Refuse to install when the migration would run onto existing tables
        run: |
          php -r '(new PDO("sqlite:database/database.sqlite"))->exec("delete from migrations");'

          set +e
          php artisan jetstream:install livewire --api --verification > /tmp/install-unrecorded.log 2>&1
          status=$?
          set -e

          cat /tmp/install-unrecorded.log

          if [ "$status" -eq 0 ]; then
            echo 'The installer accepted tables its migration is about to try to create.'
            exit 1
          fi

          grep -q 'without the migration that creates' /tmp/install-unrecorded.log || {
            echo 'The installer failed for some reason other than the consistency check.'
            exit 1
          }

      - name: Reset the application database
        run: php artisan db:wipe --force

      - name: Install Jetstream
        run: php artisan jetstream:install livewire --api --verification ${{ matrix.test_style == 'pest' && '--pest' || '' }}

      # The generated tests build their schema from scratch in memory, so they
      # never touch the database the installer actually migrated. Seeding it is
      # what catches a migration that was published but silently skipped.
      - name: Migrate and seed the generated application
        run: php artisan migrate --seed --force

      # install:api publishes Sanctum's migration, which types tokenable_id as
      # an auto-incrementing integer while every user this package creates has
      # a UUID key. sqlite accepts the mismatch — its dynamic typing keeps the
      # UUID as text in an integer-affinity column — so the shape of the column
      # the real installer produced is what has to be asserted, not whether a
      # token happens to store here.
      - name: Sanctum's token column takes this application's user keys
        run: |
          php -r '
            $columns = (new PDO("sqlite:database/database.sqlite"))
              ->query("pragma table_info(personal_access_tokens)")->fetchAll(PDO::FETCH_ASSOC);

            $tokenable = null;

            foreach ($columns as $column) {
              if ($column["name"] === "tokenable_id") { $tokenable = strtoupper($column["type"]); }
            }

            if ($tokenable === null) {
              fwrite(STDERR, "personal_access_tokens.tokenable_id is missing.\n");
              exit(1);
            }

            if (str_contains($tokenable, "INT")) {
              fwrite(STDERR, "tokenable_id is $tokenable; a UUID user key does not fit in it.\n");
              exit(1);
            }

            echo "tokenable_id => $tokenable\n";
          '

          # And prove it end to end rather than by column type alone: issue a
          # real token to a real user through Sanctum.
          php artisan tinker --execute='
            $user = App\Models\User::factory()->create();
            $token = $user->createToken("ci");
            if ((string) $token->accessToken->tokenable_id !== (string) $user->id) {
              fwrite(STDERR, "The token was not stored against its owner.\n");
              exit(1);
            }
            echo "issued a token to ".$user->id.PHP_EOL;
          '

      - name: Install NPM dependencies
        run: npm i

      - name: Compile assets
        run: npm run build

      - name: Execute tests
        run: ${{ matrix.test_style == 'pest' && 'vendor/bin/pest' || 'vendor/bin/phpunit' }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      # Last, because it deliberately breaks the application's migrations and
      # re-runs the installer over the top of a working install. Nothing below
      # depends on the state this leaves behind.
      #
      # The installer shells out to "artisan migrate --force". If that child
      # fails, the installer has to fail with it — the whole point of the
      # scaffolding is that it matches the schema the migrations build.
      - name: Fail the install when the migrations fail
        run: |
          cat > database/migrations/9999_12_31_235959_deliberately_broken.php <<'PHP'
          <?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Support\Facades\Schema;

          return new class extends Migration
          {
              public function up(): void
              {
                  // The users table is always there by now, so creating it
                  // again is a migration that fails the way a real one does.
                  Schema::create('users', fn () => null);
              }
          };
          PHP

          set +e
          php artisan jetstream:install livewire --api --verification > /tmp/broken-install.log 2>&1
          status=$?
          set -e

          cat /tmp/broken-install.log

          if [ "$status" -eq 0 ]; then
            echo 'The installer exited zero after its migrations failed.'
            exit 1
          fi

          if grep -q 'installed successfully' /tmp/broken-install.log; then
            echo 'The installer announced success after its migrations failed.'
            exit 1
          fi

          # The installer's own verdict, and the child's reason for it, both
          # have to survive to the operator.
          grep -q 'The database migrations failed with exit status' /tmp/broken-install.log || {
            echo 'The installer did not report the migration failure.'
            exit 1
          }

          grep -q 'deliberately_broken' /tmp/broken-install.log || {
            echo 'The migration output was swallowed.'
            exit 1
          }
