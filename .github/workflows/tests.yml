name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.5]
        laravel: [13]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts=^${{ matrix.laravel }}" --dev --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/phpunit --display-deprecations --fail-on-deprecation

  stub-tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        test_style: [phpunit, pest]

    name: Test Stubs - Laravel 13 - livewire - ${{ matrix.test_style }}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Create a Laravel application
        run: composer create-project laravel/laravel:13.x-dev .

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'jetstream'
          persist-credentials: false

      - name: Require the checked out package
        run: |
          composer config repositories.jetstream '{"type": "path", "url": "jetstream", "options": {"symlink": false}}' --file composer.json
          composer require devbaa/jetstream:@dev --prefer-dist --no-interaction --no-progress -W

      - name: Verify the package under test
        run: |
          composer show devbaa/jetstream
          if composer show --name-only 2>/dev/null | grep -qx 'laravel/jetstream'; then
            echo 'Upstream laravel/jetstream must not be installed alongside devbaa/jetstream.'
            exit 1
          fi

      # "composer create-project" migrates the application it creates, so at
      # this point it carries Laravel's own users table — the exact condition
      # that silently produced a broken schema. Pin the refusal here, on the
      # real generated application, before wiping for the clean install below.
      - name: Refuse to install onto a pre-migrated application
        run: |
          php -r 'file_put_contents("/tmp/users-before.json", json_encode(
            (new PDO("sqlite:database/database.sqlite"))
              ->query("pragma table_info(users)")->fetchAll(PDO::FETCH_ASSOC)
          ));'

          set +e
          php artisan jetstream:install livewire --api --verification > /tmp/install.log 2>&1
          status=$?
          set -e

          cat /tmp/install.log

          if [ "$status" -eq 0 ]; then
            echo 'The installer accepted a users table it did not create.'
            exit 1
          fi

          # Any crash also exits non-zero, so the refusal itself has to be the
          # reason: assert the message, not just the status.
          grep -q 'was not created by Jetstream' /tmp/install.log || {
            echo 'The installer failed for some reason other than the schema check.'
            exit 1
          }

          php -r '
            $after = json_encode(
              (new PDO("sqlite:database/database.sqlite"))
                ->query("pragma table_info(users)")->fetchAll(PDO::FETCH_ASSOC)
            );

            if ($after !== file_get_contents("/tmp/users-before.json")) {
              fwrite(STDERR, "The refused install changed the users table.\n");
              exit(1);
            }
          '

      - name: Reset the application database
        run: php artisan db:wipe --force

      - name: Install Jetstream
        run: php artisan jetstream:install livewire --api --verification ${{ matrix.test_style == 'pest' && '--pest' || '' }}

      # The generated tests build their schema from scratch in memory, so they
      # never touch the database the installer actually migrated. Seeding it is
      # what catches a migration that was published but silently skipped.
      - name: Migrate and seed the generated application
        run: php artisan migrate --seed --force

      - name: Install NPM dependencies
        run: npm i

      - name: Compile assets
        run: npm run build

      - name: Execute tests
        run: ${{ matrix.test_style == 'pest' && 'vendor/bin/pest' || 'vendor/bin/phpunit' }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
